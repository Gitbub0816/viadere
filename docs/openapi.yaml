openapi: 3.1.0
info:
  title: Viadere Business API
  version: "2026-10-27"
  summary: Issue structured interactions to verified customers, receive their decisions, and exchange messages.
  description: |
    The business API lets a **verified** business ask a connected customer to confirm, choose, acknowledge, reply,
    authenticate or authorize something, route support messages, publish ongoing-event statuses, and receive signed
    webhooks when anything changes.

    Hand-written from the route catalog (`Packages/ViadereCore/Sources/ViadereCore/API/APIRoutes.swift`) and the DTOs in
    `ViadereCore`; wire formats are normative in `docs/SECURITY.md`. See `docs/BUSINESS-INTEGRATION.md` for a quickstart.

    ## Authentication
    `Authorization: Bearer vdk_live_…` (real customers) or `vdk_test_…` (sandbox only). Keys are created in the
    business dashboard, are scoped, revocable, and shown once. Suspended or unverified businesses receive `403`.

    ## Capabilities and key scopes
    Every key carries a set of **capabilities** (`message.send`, `auth.challenge`, `transaction.approve`, ...) besides its operational
    scopes, and a capability is usable only if the **key carries it and the business is entitled to it now**: Viadere grants
    entitlements, by an audited operator decision with a recorded purpose; every verified business holds the messaging capabilities
    (`message.send`, `contact.reachable`, `consent.request`) and nothing else by default. Revoking an entitlement removes the
    capability from every existing key on its next request. An interaction of kind `authenticate` needs `auth.challenge`, `authorize`
    needs `transaction.approve`, every other kind `message.send`; reading or cancelling an interaction needs the capability of its
    kind. A key without it gets `403 insufficient_scope`; a business without the entitlement `403 not_entitled`; a capability Viadere
    switched off `403 capability_disabled`. `GET /v1/business/capabilities` lists what the key can do right now and the capability
    catalog (inputs, evidence, disclosed output fields, retention, revocation behavior).

    ## Customer references
    A customer is addressed by `relationshipId`, by `subjectRef`, or by both (which must agree). `subjectRef` (`sub_…`) is a pairwise
    pseudonym: stable for your business, unrelated to the same customer's reference at any other business, and not derivable by
    anyone without Viadere's key. A reference or id that is not yours is `404`, the same as one that does not exist. The older
    per-business `consumerId` / `consumerReference` pseudonym is still returned but deprecated: use `subjectRef`.

    ## Test mode
    A `vdk_test_…` key can **only address sandbox relationships**, never a real customer: create one with
    `POST /v1/business/sandbox/relationships`. Sandbox consumers have no device and no phone, so test traffic is never pushed,
    texted, decided by a real device, counted against your quota, or billed. A live key cannot address a sandbox relationship
    (`404`), and a test key used with a real relationship is `403`. The same applies to rewards, points, redemption codes, reward revocation, interaction outcome and cancel (a test key sees only test objects), and a test key cannot change the loyalty program or issue a reward to every member. `interaction.decided` webhooks never carry the raw signed decision (`deviceRef` and `verification` instead).

    ## Idempotency
    Every `POST` that creates something takes an `Idempotency-Key` header which **must equal** the body's `idempotencyKey`.
    Repeating a request with the same key and body returns the original result (`200` instead of `201`); the same key with a
    different body is `409 idempotency_conflict`. Webhook creation, webhook secret rotation and interaction cancel also
    **require** an `Idempotency-Key` header (1-128 characters of `A-Za-z0-9_.-:`, no body field to match; a missing or invalid one is
    `422`). A retry of one of those returns the original result (`200`); because creation and rotation return a one-time secret,
    the sealed result is replayable for 24 hours, after which a replay is `410 gone` (rotate to get a new secret).

    ## Errors
    Every error body is `{"error":{"code","message","requestId","details?"}}`. Quote `requestId` when contacting support.

    ## Rate limits
    Per business (default burst 120, sustained 600 requests/minute) plus a daily live-interaction quota. Exceeding either
    returns `429` with `Retry-After` (seconds). Complaint and opt-out rates above Viadere's thresholds automatically reduce
    both limits; paying never changes the priority of your messages or bypasses a customer's consent.

    ## Security model
    * Security-sensitive kinds (`authenticate`, `authorize`, unknown kinds, or any `high`/`critical` sensitivity) can only be
      approved by a device-signed decision in the Viadere app. They are never approvable by SMS or RCS reply; text channels
      receive a secure handoff link instead.
    * You see a per-business pseudonym for each customer, never their Viadere identity or phone number. A decision names the
      deciding **device** by a per-business pseudonym (`deviceRef`) and carries the server's attestation that the device
      signature, the shown context and the assurance were verified (`verification`). You never receive the raw device-signed
      decision (it contains the global device id); Viadere keeps it for disputes.
    * Business text shown on approval screens may not contain bidirectional, zero-width, control or line-separator
      characters, may not start with (or, for names, mention) "Viadere", and is capped in graphemes, unicode scalars and UTF-8
      bytes; violations are `422 validation_failed`.
  license:
    name: Proprietary
    identifier: LicenseRef-Viadere
servers:
  - url: https://viadere.com
    description: Production
security:
  - apiKey: []
tags:
  - name: Interactions
  - name: Messages
  - name: Statuses
  - name: Webhooks
  - name: Rewards
  - name: Capabilities
  - name: Verification

paths:
  /v1/business/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCapabilities
      summary: What this key can do right now
      description: |
        Any valid key. Returns the business's risk tiers, the capabilities Viadere granted it (the ceiling), the capabilities this key
        carries, their intersection minus anything switched off (`effective`), and the capability catalog. Informational: every request
        is still evaluated by the policy engine, and a capability withdrawn a moment ago may still be listed until the next request.
      responses:
        "200":
          description: The key's capabilities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessCapabilitiesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/business/interactions:
    post:
      tags: [Interactions]
      operationId: issueInteraction
      summary: Issue an interaction
      description: |
        Requires scope `interactions:write` and the capability of the interaction's kind (`authenticate` needs `auth.challenge`,
        `authorize` needs `transaction.approve`, every other kind `message.send`). For `authenticate` and `authorize` the customer must also have a registered authenticator (an enrolled device), else `403 policy_denied`. The relationship must belong to your business and be active, the customer must have
        consented to the `purpose`, and your daily quota must not be exhausted. Priority is clamped by the Trust Engine
        (marketing and rewards never exceed `normal`; `urgent` is reserved for security authenticate/authorize).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInteractionRequest" }
            examples:
              confirmPickup:
                summary: Ask a customer to confirm a pickup
                value:
                  relationshipId: 11111111-2222-4333-8444-555555555555
                  kind: confirm
                  purpose: transactional
                  payload:
                    title: Confirm pickup
                    details: Thursday 10:30 at Main Street
                    reference: BK-20418
                  priority: normal
                  sensitivity: standard
                  allowedChannels: [nativePush, inApp, rcs, sms]
                  ttlSeconds: 3600
                  idempotencyKey: order-1042-confirm
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "200":
          description: The idempotency key was already used with an identical request; the original interaction is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/interactions/{interactionId}:
    get:
      tags: [Interactions]
      operationId: getInteractionOutcome
      summary: Get an interaction's outcome
      description: Requires scope `interactions:read` and the capability of the interaction's kind. Pending interactions past their expiry are reported as `expired`.
      parameters:
        - $ref: "#/components/parameters/InteractionId"
      responses:
        "200":
          description: The current outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/interactions/{interactionId}/cancel:
    post:
      tags: [Interactions]
      operationId: cancelInteraction
      summary: Cancel a pending interaction
      description: |
        Requires scope `interactions:write`, the capability of the interaction's kind and an `Idempotency-Key` header. Cancelling an interaction that is already final returns
        its outcome unchanged. The same key with another interaction is `409 idempotency_conflict`.
      parameters:
        - $ref: "#/components/parameters/InteractionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The outcome after cancellation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteractionOutcome" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message to a customer
      description: |
        Requires scope `messages:write` and the capability `message.send`. Delivered into the customer's active SMS session with you, or held in the
        conversation history. Always attributed to your verified business name.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessSendMessageRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessage" }
        "200":
          description: Idempotent replay of an earlier identical request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/statuses:
    post:
      tags: [Statuses]
      operationId: updateStatus
      summary: Publish an ongoing-event status
      description: |
        Requires scope `statuses:write` and the capability `message.send`. A newer status with the same `activityKey` replaces the earlier one. Eligible
        purposes (`transactional`, `accountService`, `support`) may drive a Live Activity on the customer's device.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessStatusUpdateRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Interaction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/sandbox/relationships:
    post:
      tags: [Interactions]
      operationId: createSandboxRelationship
      summary: Create a sandbox relationship (test keys only)
      description: |
        Creates a sandbox consumer connected to your business and returns the relationship id to use with a `vdk_test_…` key.
        Requires scope `interactions:write` and a **test** key (`403` with a live key). At most 50 per business.
      responses:
        "201":
          description: The sandbox relationship.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxRelationship" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      description: Requires scope `webhooks:manage`.
      responses:
        "200":
          description: Active subscriptions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookSubscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: |
        Requires scope `webhooks:manage`. The URL must be a public `https` URL (private, loopback, link-local and cloud
        metadata addresses are refused, and redirects are never followed). The signing `secret` in the response is shown
        **once**. At most 10 active endpoints per business. Requires an `Idempotency-Key` header: a retry with the same key and body
        returns the same subscription and secret (`200`) for 24 hours; the same key with another body is `409 idempotency_conflict`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecretResponse" }
        "200":
          description: The idempotency key was already used with an identical request; the original subscription and secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/webhooks/{webhookId}:
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Requires scope `webhooks:manage`. Pending deliveries to the endpoint are dropped.
      parameters:
        - $ref: "#/components/parameters/WebhookId"
      responses:
        "200":
          description: Deleted (an empty object).
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/webhooks/{webhookId}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate a webhook signing secret
      description: |
        Requires scope `webhooks:manage`. The previous secret keeps signing for 24 hours (the `Viadere-Signature` header then
        carries two `v1=` values) so you can switch over without dropping events. Requires an `Idempotency-Key` header: a retry with the
        same key returns the same new secret instead of rotating again (24 hours; the same key for another webhook is
        `409 idempotency_conflict`).
      parameters:
        - $ref: "#/components/parameters/WebhookId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The new secret (shown once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/loyalty/program:
    get:
      tags: [Rewards]
      operationId: getLoyaltyProgram
      summary: Read your loyalty program
      description: Requires scope `rewards:write`. `404` until you create one.
      responses:
        "200":
          description: The program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessLoyaltyProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
    put:
      tags: [Rewards]
      operationId: saveLoyaltyProgram
      summary: Create or replace your loyalty program
      description: |
        Requires scope `rewards:write`. One program per business. `timeZone` is the IANA zone whose midnight starts a "day" for
        recurring rewards and per-day limits. Changing `termsVersion` makes customers accept the new terms to join (an enroll call
        with the old version is `409`); existing members keep their balance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertLoyaltyProgramRequest" }
      responses:
        "200":
          description: The saved program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessLoyaltyProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/loyalty/points:
    post:
      tags: [Rewards]
      operationId: adjustLoyaltyPoints
      summary: Add or remove points for an enrolled customer
      description: |
        Requires scope `rewards:write`. Idempotent on `idempotencyKey` (the `Idempotency-Key` header must equal it): a replay changes
        nothing and returns `applied: false`. A balance never goes below zero (`409`). The customer must have joined your program (`409`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustLoyaltyPointsRequest" }
      responses:
        "200":
          description: The new balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyPointsResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/rewards:
    get:
      tags: [Rewards]
      operationId: listRewards
      summary: List your rewards
      description: Requires scope `rewards:write`. Newest first, at most 200.
      responses:
        "200":
          description: Your rewards.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Rewards]
      operationId: createReward
      summary: Create a reward
      description: |
        Requires scope `rewards:write`. Without `relationshipId` the reward belongs to your program and every connected customer sees
        it with their own **server-computed** eligibility; with one, only that customer does. Kinds: `coupon` and `offer` are claimed
        before use; `perk` and `pointsReward` are redeemed directly. A `recurrence` limits the reward to ISO weekdays (1 = Monday)
        evaluated in the recurrence's time zone, with `perDayLimit` redemptions per local day; without one, coupons, offers and perks
        can be redeemed once per customer and points rewards as often as the balance allows.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueRewardRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/rewards/{rewardId}/revoke:
    post:
      tags: [Rewards]
      operationId: revokeReward
      summary: Withdraw a reward
      description: |
        Requires scope `rewards:write`. Outstanding redemption codes stop validating (`410`), held points return to customers, and
        Wallet passes for the reward are voided. Safe to repeat.
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Uuid" }
      responses:
        "200":
          description: The revoked reward.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/business/redemptions/consume:
    post:
      tags: [Rewards]
      operationId: consumeRedemption
      summary: Validate and consume a redemption code
      description: |
        Requires scope `rewards:write`. Validation and consumption are **one atomic step**: of any number of concurrent calls for a code,
        exactly one succeeds. Codes look like `K7M2Q-9XPB4`, are valid for about two minutes after the customer asks for them, and are
        single use; case, dashes and spaces are ignored.

        | Result | Meaning |
        |---|---|
        | `200` | Redeemed. Give the customer their reward. |
        | `404` | Unknown, malformed or another business's code (indistinguishable on purpose). |
        | `409` | Already used (`details.redeemedAt`). |
        | `410` | Expired, or the reward was withdrawn. |
        | `429` | Too many attempts; the budget (60/min, burst 30 per business) bounds code guessing. |

        This call is not retried automatically by the SDK: if a response is lost, a repeat answers `409`, so confirm with the customer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsumeRedemptionRequest" }
      responses:
        "200":
          description: Consumed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedemptionReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: The code expired or the reward was withdrawn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/verification-requests:
    post:
      tags: [Verification]
      operationId: createVerificationRequest
      summary: Ask a customer to verify an age threshold or an identity attribute
      description: |
        Needs the capability (`age.minimum`, `identity.name`, `identity.address` or `identity.verified`) on the key **and** in your business's
        entitlements (risk tier V; identity attributes also need a recorded heightened review). A key that carries only messaging
        capabilities gets `403 insufficient_scope`. The request is checked by the policy engine before anything about the customer is read.

        The customer sees who you are, the purpose, **exactly** what will be shared, who receives it and when the request expires, and gives
        consent for that disclosure (a consent receipt). Wallet (an ID in Apple Wallet) is offered first; document scanning is the alternative.
        `callback_id` names one of **your registered webhook endpoints** subscribed to `verification.completed`; a URL is never accepted.
        `expires_in_seconds` is 30 to 600 (default 300).

        An `age.minimum` result discloses only `meets_threshold`, `assurance`, `issued_at`, `expires_at` and `audience`: never a birthdate,
        an age, a name or a document number.
        Idempotent on the `Idempotency-Key` header.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVerificationRequest" }
            example:
              subject_ref: "sub_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789-_AbCdE"
              capability: age.minimum
              parameters: { years: 18 }
              purpose_code: age_restricted_access
              callback_id: "5d1b2a60-0000-4000-8000-000000000001"
              expires_in_seconds: 180
      responses:
        "200":
          description: The idempotency key was used before with the same request; the original request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequest" }
        "201":
          description: Created and delivered to the customer's app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/verification-requests/{requestId}:
    get:
      tags: [Verification]
      operationId: getVerificationRequest
      summary: The state of a verification request
      description: |
        `pending` until the request ends, then `completed` with a `result_ref`. There is no "declined", "expired" or "failed" here: every end
        that is not a positive result is the same `not_verified` result (a customer under the threshold, a customer who said no and a
        failed check are indistinguishable to you, AGE-005). Needs the request's capability on the key.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, pattern: "^req_[A-Za-z0-9_-]{22}$" } }
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/verification-results/{resultRef}:
    get:
      tags: [Verification]
      operationId: getVerificationResult
      summary: Retrieve a verification result (once)
      description: |
        Authenticated and **bound to your business**: another business's `result_ref` is a plain `404`. **Single use**: the first successful
        call returns the result and erases it; any later call is `410`. Results expire 15 minutes after they are issued (`410`). The response is
        `Cache-Control: no-store`. Store what you need.

        `outcome` is `verified` or `not_verified` (with an empty `result`). `result` holds exactly the capability's output fields.
        `result.assurance` names the evidence and binding (for example `issuer_signed_credential_device_bound` for a Wallet ID,
        `document_and_biometric_match` for a scanned document, `sandbox_simulated` for test mode); it is **not** a NIST IAL/AAL claim.
        A selfie age estimate never produces `meets_threshold`.
      parameters:
        - { name: resultRef, in: path, required: true, schema: { type: string, pattern: "^res_[A-Za-z0-9_-]{43}$" } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/RateLimited" }

webhooks:
  interaction.decided:
    post:
      summary: A customer decided an interaction
      description: |
        Sent once when the decision is recorded. `data.assurance`, `data.deviceRef` and `data.verification` are present for
        device-signed decisions (there is no `signedDecision`: see the security model); a decision made over a text channel
        (RCS suggested reply to a low-sensitivity `confirm`/`choose`) carries `channel: rcs` and **no** assurance or
        verification, and you must treat it accordingly.
      requestBody: { $ref: "#/components/requestBodies/InteractionEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  interaction.expired:
    post:
      summary: An interaction expired undecided
      requestBody: { $ref: "#/components/requestBodies/InteractionEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  interaction.cancelled:
    post:
      summary: An interaction was cancelled (by you, or because the customer disconnected)
      requestBody: { $ref: "#/components/requestBodies/InteractionEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  message.received:
    post:
      summary: A customer's message was forwarded to you
      description: The only event whose payload contains customer-authored text. The dashboard delivery log redacts it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WebhookEventEnvelope" }
                - type: object
                  properties:
                    type: { const: message.received }
                    data: { $ref: "#/components/schemas/MessageReceivedData" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  relationship.connected:
    post:
      summary: A customer connected to your business
      requestBody: { $ref: "#/components/requestBodies/RelationshipEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  relationship.disconnected:
    post:
      summary: A customer disconnected; pending interactions were cancelled
      requestBody: { $ref: "#/components/requestBodies/RelationshipEvent" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  reward.redeemed:
    post:
      summary: A redemption code was consumed
      description: Sent once when you consume a code. `data` is the same `RedemptionReceipt` the consume call returned (pseudonymous).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WebhookEventEnvelope" }
                - type: object
                  properties:
                    type: { const: reward.redeemed }
                    data: { $ref: "#/components/schemas/RedemptionReceipt" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  consent.updated:
    post:
      summary: A customer changed a consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WebhookEventEnvelope" }
                - type: object
                  properties:
                    type: { const: consent.updated }
                    data: { $ref: "#/components/schemas/ConsentUpdatedData" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }
  verification.completed:
    post:
      summary: A verification request ended
      description: |
        Sent to the endpoint named by the request's `callback_id` when the request ends, with **any** outcome (a positive result, a decline, an
        expiry and a failed check all send the same event). The body is opaque: it names the request and the result and carries nothing else.
        Fetch the result with `GET /v1/verification-results/{result_ref}`. Subscriptions that opted into the `2026-10-27` envelope receive the
        spec 14.3 form (`id`, `type`, `version`, `tenant_id`, `request_id`, `occurred_at`, `result_ref`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WebhookEventEnvelope" }
                - type: object
                  properties:
                    type: { const: verification.completed }
                    data:
                      type: object
                      required: [request_id, result_ref]
                      additionalProperties: false
                      properties:
                        request_id: { type: string, pattern: "^req_[A-Za-z0-9_-]{22}$" }
                        result_ref: { type: string, pattern: "^res_[A-Za-z0-9_-]{43}$" }
      responses: { "2XX": { $ref: "#/components/responses/WebhookAck" } }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "vdk_live_… | vdk_test_…"
      description: A business API key. Keys are scoped; the required scope is listed on each operation.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must equal the request body's `idempotencyKey` where the body has one (issue, messages, statuses, rewards, points); webhook create, webhook rotate and interaction cancel have no body key, the header alone identifies the operation. Up to 128 characters of `A-Z a-z 0-9 _ . - :`.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
    InteractionId:
      name: interactionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }

  headers:
    WebhookSignature:
      description: "`t={unix seconds},v1={hex HMAC-SHA256(secret, \"{t}.\" + raw body)}`; several `v1=` values during secret rotation."
      schema: { type: string }
    WebhookEventId:
      description: "The delivery id (`WebhookEvent.id`). Deliveries are at-least-once: deduplicate on it."
      schema: { type: string, format: uuid }
    WebhookEventType:
      description: The event type (`WebhookEvent.type`).
      schema: { type: string }

  requestBodies:
    InteractionEvent:
      required: true
      description: |
        Headers sent with every delivery: `Viadere-Signature`, `Viadere-Event-Id`, `Viadere-Event-Type`, `Content-Type: application/json`.
        Reject (4xx) when `|now - t| > 300 s` or no `v1` matches (constant-time compare). Respond `2xx` within 10 seconds;
        failures retry at 30 s, 2 min, 10 min, 1 h, 6 h, 12 h, 24 h, then dead-letter.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/WebhookEventEnvelope" }
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/InteractionOutcome" }
    RelationshipEvent:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - { $ref: "#/components/schemas/WebhookEventEnvelope" }
              - type: object
                properties:
                  data: { $ref: "#/components/schemas/RelationshipEventData" }

  responses:
    WebhookAck:
      description: Acknowledge with any 2xx. Anything else (or a timeout) is retried.
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Missing, malformed, unknown, revoked or expired API key.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: The key lacks the required scope (`insufficient_scope`), the capability or the business's entitlement (`insufficient_scope`, `not_entitled`), the capability is switched off (`capability_disabled`), a policy rule or evidence requirement denies it (`policy_denied`), the business is not active (unverified or suspended), or consent is required (`consent_required`).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Not found. Other businesses' resources are indistinguishable from missing ones.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: State conflict, or `idempotency_conflict` when the key was used with a different body.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Gone:
      description: The request was already completed and its one-time secret can no longer be replayed.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ValidationFailed:
      description: The request failed validation; `error.details` maps field paths to issue codes.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Rate limit or daily quota exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer, minimum: 1 }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    Uuid:
      type: string
      format: uuid
      description: Lowercase UUID.
    Timestamp:
      type: string
      format: date-time
      description: "ISO 8601 UTC with milliseconds, e.g. `2026-10-27T08:00:00.000Z`."

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            requestId: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    ErrorCode:
      type: string
      description: Stable machine codes. Unknown future codes should be treated as `unknown`.
      enum: [bad_request, validation_failed, unauthorized, signature_invalid, replay_detected, clock_skew, forbidden, not_found, conflict,
             gone, expired, insufficient_assurance, consent_required, insufficient_scope, not_entitled, capability_disabled, policy_denied, rate_limited, idempotency_conflict, internal_error, unavailable,
             passkey_assertion_required, device_cool_down, context_digest_required, context_mismatch, unknown]

    InteractionKind:
      type: string
      description: Extensible. Unknown kinds are treated as maximally sensitive and never rendered as actionable.
      enum: [authenticate, authorize, confirm, choose, acknowledge, reply, status, reward, ticket, message]
    InteractionPurpose:
      type: string
      description: Consent is granted per purpose. `security` and `accountService` cannot be turned off by the customer; `marketing` and `rewards` are opt-in.
      enum: [security, accountService, transactional, support, marketing, rewards]
    InteractionPriority:
      type: string
      description: A request. Viadere clamps it; it can never be bought.
      enum: [low, normal, high, urgent]
    Sensitivity:
      type: string
      description: Drives the required assurance. `authenticate`/`authorize` are never below `standard`.
      enum: [low, standard, high, critical]
    Channel:
      type: string
      description: |
        Where Viadere may deliver. Text channels (`sms`, `rcs`, `appleMessagesForBusiness`) can only carry unauthenticated replies, so
        security-sensitive interactions sent there become a secure handoff link. `rcs` implies SMS fallback.
      enum: [nativePush, inApp, web, sms, rcs, appleMessagesForBusiness]
    ActionRole:
      type: string
      enum: [approve, deny, confirm, decline, select, reply, acknowledge, open, report, redeem]
    Decision:
      type: string
      enum: [approve, deny, confirm, decline, select, reply, acknowledge, report]
    DecisionAssurance:
      type: string
      enum: [none, devicePasscode, biometric]
    InteractionStatus:
      type: string
      enum: [pending, approved, denied, confirmed, declined, selected, replied, acknowledged, reported, expired, cancelled, delivered]

    MoneyAmount:
      type: object
      required: [value, currency]
      properties:
        value: { type: string, pattern: "^[0-9]{1,15}(\\.[0-9]+)?$", description: Plain decimal string with the currency's minor-unit digits, e.g. "285.28". }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    RiskIndicator:
      type: object
      required: [code, label, severity]
      properties:
        code: { type: string, maxLength: 40, pattern: "^[A-Za-z0-9_.:-]+$" }
        label: { type: string, maxLength: 80 }
        severity: { type: string, enum: [info, warning, high] }
    RequestedAction:
      type: object
      required: [id, label, role]
      properties:
        id: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]+$" }
        label: { type: string, maxLength: 32 }
        role: { $ref: "#/components/schemas/ActionRole" }

    AuthenticatePayload:
      type: object
      required: [service, device, attemptedAt]
      properties:
        service: { type: string, maxLength: 80 }
        device: { type: string, maxLength: 80 }
        approximateLocation: { type: string, maxLength: 80 }
        ipRegion: { type: string, maxLength: 80 }
        attemptedAt: { $ref: "#/components/schemas/Timestamp" }
        riskIndicators: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/RiskIndicator" } }
    AuthorizePayload:
      type: object
      required: [actionDescription]
      properties:
        actionDescription: { type: string, maxLength: 120 }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        merchant: { type: string, maxLength: 80 }
        location: { type: string, maxLength: 80 }
        effectOfApproval: { type: string, maxLength: 160 }
        riskIndicators: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/RiskIndicator" } }
    ConfirmPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 80 }
        details: { type: string, maxLength: 160 }
        reference: { type: string, maxLength: 64 }
        scheduledAt: { $ref: "#/components/schemas/Timestamp" }
    ChoiceOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]+$" }
        label: { type: string, maxLength: 80 }
    ChoosePayload:
      type: object
      required: [prompt, options]
      properties:
        prompt: { type: string, maxLength: 160 }
        options: { type: array, minItems: 2, maxItems: 10, items: { $ref: "#/components/schemas/ChoiceOption" } }
        allowsMultiple: { type: boolean, default: false }
    AcknowledgePayload:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 1000 }
        documentURL: { type: string, format: uri }
        documentVersion: { type: string, maxLength: 40 }
        documentDigest: { type: string, pattern: "^[0-9a-f]{64}$", description: Lowercase hex SHA-256 of the document shown. It is kept in the customer's acknowledgment record. }
    ReplyPayload:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, maxLength: 160 }
        maxLength: { type: integer, default: 280 }
        suggestedReplies: { type: array, maxItems: 4, items: { type: string } }
    StatusPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 240 }
        liveActivity: { $ref: "#/components/schemas/LiveActivityStatus" }
    LiveActivityStatus:
      type: object
      description: "`{\"type\":\"delivery\",\"delivery\":{…}}` — exactly one state object matching `type`."
      required: [type]
      properties:
        type: { type: string, enum: [order, delivery, flight, appointment] }
        order:
          type: object
          required: [orderReference, stage]
          properties:
            orderReference: { type: string }
            stage: { type: string, enum: [placed, preparing, ready, completed, cancelled] }
            estimatedReadyAt: { $ref: "#/components/schemas/Timestamp" }
            note: { type: string }
        delivery:
          type: object
          required: [trackingReference, stage]
          properties:
            trackingReference: { type: string }
            stage: { type: string, enum: [labelCreated, inTransit, outForDelivery, delivered, exception] }
            carrierName: { type: string }
            estimatedDeliveryAt: { $ref: "#/components/schemas/Timestamp" }
            stopsAway: { type: integer }
        flight:
          type: object
          required: [flightNumber, departureAirport, arrivalAirport, stage, scheduledDeparture]
          properties:
            flightNumber: { type: string }
            departureAirport: { type: string }
            arrivalAirport: { type: string }
            stage: { type: string, enum: [scheduled, delayed, boarding, departed, landed, cancelled, diverted] }
            scheduledDeparture: { $ref: "#/components/schemas/Timestamp" }
            estimatedDeparture: { $ref: "#/components/schemas/Timestamp" }
            estimatedArrival: { $ref: "#/components/schemas/Timestamp" }
            gate: { type: string }
            seat: { type: string }
        appointment:
          type: object
          required: [title, startsAt, stage]
          properties:
            title: { type: string }
            startsAt: { $ref: "#/components/schemas/Timestamp" }
            location: { type: string }
            providerName: { type: string }
            stage: { type: string, enum: [upcoming, checkInOpen, checkedIn, inProgress, completed, cancelled] }
    MessagePayload:
      type: object
      required: [text]
      properties:
        text: { type: string }
        sessionId: { $ref: "#/components/schemas/Uuid" }
    RewardPayload:
      type: object
      description: Announces a reward in the customer's inbox. Create the reward itself with `POST /v1/business/rewards`.
      required: [rewardId, title]
      properties:
        rewardId: { $ref: "#/components/schemas/Uuid" }
        title: { type: string }
        details: { type: string }
        redeemBy: { $ref: "#/components/schemas/Timestamp" }
        walletPassId: { $ref: "#/components/schemas/Uuid" }
    TicketPayload:
      type: object
      description: |
        A ticket, pass or admission. `venue`, `seat` and `startsAt` appear on the customer's Activity row and on the Wallet pass. Tickets,
        status updates and confirmations that share a `correlationId` (an order, trip or appointment id) are shown as one Activity item.
      required: [title, ticketType]
      properties:
        title: { type: string }
        ticketType: { type: string, description: "boarding_pass, event, admission, reservation…" }
        holderName: { type: string }
        validFrom: { $ref: "#/components/schemas/Timestamp" }
        validUntil: { $ref: "#/components/schemas/Timestamp" }
        walletPassId: { $ref: "#/components/schemas/Uuid" }
        venue: { type: string, maxLength: 80, description: "e.g. Orpheum Theatre, or Gate B4." }
        seat: { type: string, maxLength: 80, description: "e.g. Row F · Seat 12." }
        startsAt: { $ref: "#/components/schemas/Timestamp" }
    InteractionPayload:
      description: The payload object for the declared `kind` (payload shapes overlap, so the sibling `kind` is the discriminator).
      anyOf:
        - { $ref: "#/components/schemas/AuthenticatePayload" }
        - { $ref: "#/components/schemas/AuthorizePayload" }
        - { $ref: "#/components/schemas/ConfirmPayload" }
        - { $ref: "#/components/schemas/ChoosePayload" }
        - { $ref: "#/components/schemas/AcknowledgePayload" }
        - { $ref: "#/components/schemas/ReplyPayload" }
        - { $ref: "#/components/schemas/StatusPayload" }
        - { $ref: "#/components/schemas/RewardPayload" }
        - { $ref: "#/components/schemas/TicketPayload" }
        - { $ref: "#/components/schemas/MessagePayload" }

    CreateVerificationRequest:
      type: object
      required: [subject_ref, capability, purpose_code]
      additionalProperties: false
      properties:
        subject_ref: { $ref: "#/components/schemas/SubjectRef" }
        capability: { type: string, enum: [age.minimum, identity.name, identity.address, identity.verified] }
        parameters:
          type: object
          description: "`age.minimum`: `{ \"years\": 13 | 16 | 18 | 21 | 25 }`. The identity capabilities take none. Unknown parameters are rejected."
        purpose_code: { type: string, pattern: "^[a-z][a-z0-9_]{2,47}$", examples: [age_restricted_access] }
        callback_id:
          type: string
          format: uuid
          description: The id of a webhook endpoint you registered (subscribed to `verification.completed`). Never a URL.
        expires_in_seconds: { type: integer, minimum: 30, maximum: 600, default: 300 }
    VerificationRequest:
      type: object
      required: [request_id, capability, subject_ref, purpose_code, status, created_at, expires_at]
      properties:
        request_id: { type: string, pattern: "^req_[A-Za-z0-9_-]{22}$" }
        capability: { type: string }
        subject_ref: { $ref: "#/components/schemas/SubjectRef" }
        purpose_code: { type: string }
        status: { type: string, enum: [pending, completed] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        result_ref: { type: string, pattern: "^res_[A-Za-z0-9_-]{43}$", description: Present once `completed`. }
    VerificationResult:
      type: object
      required: [result_ref, request_id, capability, subject_ref, parameters, created_at, outcome, result]
      additionalProperties: false
      properties:
        result_ref: { type: string }
        request_id: { type: string }
        capability: { type: string }
        subject_ref: { $ref: "#/components/schemas/SubjectRef" }
        parameters: { type: object }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        outcome: { type: string, enum: [verified, not_verified] }
        result:
          type: object
          description: |
            Exactly the capability's output fields and nothing else. `age.minimum`: `meets_threshold`, `assurance`, `issued_at`, `expires_at`,
            `audience`. `identity.name`: `given_name`, `family_name` + the same four. `identity.address`: `address` + the same four.
            `identity.verified`: `verified` + the same four. Empty for `not_verified`.
          properties:
            meets_threshold: { type: boolean }
            verified: { type: boolean }
            given_name: { type: string }
            family_name: { type: string }
            address: { type: object }
            assurance: { type: string }
            issued_at: { $ref: "#/components/schemas/Timestamp" }
            expires_at: { $ref: "#/components/schemas/Timestamp" }
            audience: { type: string, description: The business the result is bound to (yours). }
    SubjectRef:
      type: string
      pattern: "^sub_[A-Za-z0-9_-]{43}$"
      description: |
        Pairwise customer reference: `sub_` + base64url(HMAC-SHA256(Viadere's subject key, "VIADERE-SUBJECT-V1\n{businessId}\n{customerId}")).
        Stable for your business, unrelated at any other business, not enumerable.

    IssueInteractionRequest:
      type: object
      required: [kind, purpose, payload, ttlSeconds, idempotencyKey]
      description: Name the customer with `relationshipId`, `subjectRef`, or both (they must agree).
      anyOf:
        - required: [relationshipId]
        - required: [subjectRef]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        kind: { $ref: "#/components/schemas/InteractionKind" }
        purpose: { $ref: "#/components/schemas/InteractionPurpose" }
        payload: { $ref: "#/components/schemas/InteractionPayload" }
        requestedActions: { type: array, maxItems: 4, default: [], items: { $ref: "#/components/schemas/RequestedAction" } }
        priority: { $ref: "#/components/schemas/InteractionPriority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        allowedChannels:
          type: array
          default: [nativePush, inApp]
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/Channel" }
        ttlSeconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: Lifetime. At most 15 minutes (900) for `authenticate` and `authorize`, 30 days otherwise.
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
        correlationId: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
        accountReference: { type: string, maxLength: 64, description: 'Shown to the customer, e.g. "Checking ••1234".' }
      allOf:
        - if: { properties: { kind: { const: authenticate } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/AuthenticatePayload" } } }
        - if: { properties: { kind: { const: authorize } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/AuthorizePayload" } } }
        - if: { properties: { kind: { const: confirm } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/ConfirmPayload" } } }
        - if: { properties: { kind: { const: choose } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/ChoosePayload" } } }
        - if: { properties: { kind: { const: acknowledge } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/AcknowledgePayload" } } }
        - if: { properties: { kind: { const: reply } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/ReplyPayload" } } }
        - if: { properties: { kind: { const: status } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/StatusPayload" } } }
        - if: { properties: { kind: { const: message } }, required: [kind] }
          then: { properties: { payload: { $ref: "#/components/schemas/MessagePayload" } } }
    Interaction:
      type: object
      description: |
        As seen by the business. `scope.consumerId` is a **per-business pseudonym** (stable for your business, different for every
        other), and `challenge` is a one-way reference, not the device challenge.
      required: [schemaVersion, id, businessId, scope, kind, purpose, payload, priority, sensitivity, allowedChannels, createdAt, expiresAt, idempotencyKey, challenge]
      properties:
        schemaVersion: { type: integer, const: 1 }
        id: { $ref: "#/components/schemas/Uuid" }
        businessId: { $ref: "#/components/schemas/Uuid" }
        scope:
          type: object
          required: [consumerId, relationshipId]
          properties:
            consumerId: { $ref: "#/components/schemas/Uuid", description: "Deprecated per-business pseudonym; use subjectRef." }
            relationshipId: { $ref: "#/components/schemas/Uuid" }
            subjectRef: { $ref: "#/components/schemas/SubjectRef" }
            accountReference: { type: string }
        kind: { $ref: "#/components/schemas/InteractionKind" }
        purpose: { $ref: "#/components/schemas/InteractionPurpose" }
        payload: { $ref: "#/components/schemas/InteractionPayload" }
        requestedActions: { type: array, items: { $ref: "#/components/schemas/RequestedAction" } }
        priority: { $ref: "#/components/schemas/InteractionPriority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        allowedChannels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        idempotencyKey: { type: string }
        correlationId: { type: string }
        challenge: { type: string, description: One-way reference. }
    SignedDecision:
      type: object
      required: [payload, signature]
      properties:
        payload: { type: string, description: Canonical JSON of the decision (docs/SECURITY.md §2.4), as signed by the device. }
        signature: { type: string, description: ECDSA P-256 / SHA-256, raw r‖s, base64url. }
    InteractionOutcome:
      type: object
      required: [interactionId, businessId, status]
      properties:
        interactionId: { $ref: "#/components/schemas/Uuid" }
        businessId: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/InteractionStatus" }
        decision: { $ref: "#/components/schemas/Decision" }
        selectedOptionIds: { type: array, items: { type: string } }
        reply: { type: string }
        assurance:
          description: Present for device-signed decisions. **Absent for decisions made on a text channel.**
          $ref: "#/components/schemas/DecisionAssurance"
        channel: { $ref: "#/components/schemas/Channel" }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        correlationId: { type: string }
        deviceRef:
          type: string
          description: Per-business pseudonym of the deciding device (stable for you, unlinkable across businesses). Device-signed decisions only.
        verification:
          description: The server's attestation that the decision was verified. Absent for text-channel decisions.
          $ref: "#/components/schemas/DecisionVerification"
    DecisionVerification:
      type: object
      required: [verified, keyPurpose, contextBound, verifiedAt, evidenceRef]
      properties:
        verified: { type: boolean, description: Always true when present. }
        keyPurpose: { type: string, enum: [request, approvalUserPresence, approvalBiometric], description: The device key that signed (`approvalBiometric` = device-bound biometric). }
        contextBound: { type: boolean, description: The decision was signed over the digest of what was shown (v2 payload) and it matched. }
        verifiedAt: { $ref: "#/components/schemas/Timestamp" }
        evidenceRef: { type: string, description: Opaque reference to the stored signed decision; quote it in a dispute. }
    SandboxRelationship:
      type: object
      required: [relationshipId, createdAt]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }

    MessageAttribution:
      type: object
      required: [senderType, displayName]
      properties:
        senderType: { type: string, enum: [consumer, business, agent, automated, viadere] }
        displayName: { type: string }
        agentName: { type: string }
    ConversationMessage:
      type: object
      required: [id, sessionId, businessId, direction, attribution, body, channel, createdAt, deliveryStatus]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        sessionId: { $ref: "#/components/schemas/Uuid" }
        businessId: { $ref: "#/components/schemas/Uuid" }
        direction: { type: string, enum: [consumerToBusiness, businessToConsumer] }
        attribution: { $ref: "#/components/schemas/MessageAttribution" }
        body: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        deliveredAt: { $ref: "#/components/schemas/Timestamp" }
        readAt: { $ref: "#/components/schemas/Timestamp" }
        deliveryStatus: { type: string, enum: [queued, sent, delivered, read, failed] }
        interactionId: { $ref: "#/components/schemas/Uuid" }
    BusinessSendMessageRequest:
      type: object
      required: [body, idempotencyKey]
      anyOf:
        - required: [relationshipId]
        - required: [subjectRef]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        sessionId: { $ref: "#/components/schemas/Uuid" }
        body: { type: string, minLength: 1, maxLength: 1600 }
        agentName: { type: string, maxLength: 40 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
    BusinessStatusUpdateRequest:
      type: object
      required: [purpose, status, activityKey, idempotencyKey]
      anyOf:
        - required: [relationshipId]
        - required: [subjectRef]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        purpose: { $ref: "#/components/schemas/InteractionPurpose" }
        status: { $ref: "#/components/schemas/StatusPayload" }
        activityKey: { type: string, minLength: 1, maxLength: 64, description: Stable key for the ongoing event (an order id) so updates replace earlier ones. }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
        correlationId: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$", description: Groups this status with the tickets and confirmations of the same order, trip or appointment in the customer's Activity feed. }

    RewardKind:
      type: string
      enum: [coupon, perk, offer, pointsReward]
    RewardRecurrence:
      type: object
      required: [weekdays, perDayLimit, timeZone]
      properties:
        weekdays: { type: array, minItems: 1, items: { type: integer, minimum: 1, maximum: 7 }, description: ISO weekdays, 1 = Monday. }
        perDayLimit: { type: integer, minimum: 1, maximum: 20, description: Redemptions allowed per local day per customer. }
        timeZone: { type: string, description: IANA zone; its midnight is the day boundary (DST-aware). }
    IssueRewardRequest:
      type: object
      required: [title, idempotencyKey]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef", description: "Alternative to relationshipId: issues the reward to that one customer." }
        title: { type: string, minLength: 1, maxLength: 80 }
        kind: { $ref: "#/components/schemas/RewardKind" }
        details: { type: string, maxLength: 300 }
        validFrom: { $ref: "#/components/schemas/Timestamp" }
        validUntil: { $ref: "#/components/schemas/Timestamp" }
        recurrence: { $ref: "#/components/schemas/RewardRecurrence" }
        pointsCost: { type: integer, minimum: 1, description: Required for `pointsReward`. }
        issueWalletPass: { type: boolean, default: false, description: For a reward issued to one customer, also issue a Wallet coupon pass. }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
    Reward:
      type: object
      required: [id, business, title, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        business: { type: object, description: Your verified business summary. }
        title: { type: string }
        details: { type: string }
        status: { type: string, enum: [available, redeemed, expired, revoked] }
        validFrom: { $ref: "#/components/schemas/Timestamp" }
        validUntil: { $ref: "#/components/schemas/Timestamp" }
        recurrence: { $ref: "#/components/schemas/RewardRecurrence" }
    LoyaltyTier:
      type: object
      required: [name, minimumPoints]
      properties:
        name: { type: string, maxLength: 30 }
        minimumPoints: { type: integer, minimum: 0 }
    UpsertLoyaltyProgramRequest:
      type: object
      required: [programName, summary, termsVersion, timeZone]
      properties:
        programName: { type: string, maxLength: 60 }
        summary: { type: string, maxLength: 280 }
        termsVersion: { type: string, maxLength: 32 }
        timeZone: { type: string }
        tiers: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/LoyaltyTier" } }
    BusinessLoyaltyProgram:
      allOf:
        - { $ref: "#/components/schemas/UpsertLoyaltyProgramRequest" }
        - type: object
          required: [memberCount, updatedAt]
          properties:
            memberCount: { type: integer }
            updatedAt: { $ref: "#/components/schemas/Timestamp" }
    AdjustLoyaltyPointsRequest:
      type: object
      required: [delta, idempotencyKey]
      anyOf:
        - required: [relationshipId]
        - required: [subjectRef]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        delta: { type: integer, description: Non-zero; at most 1,000,000 in magnitude. }
        reason: { type: string, maxLength: 40, pattern: "^[A-Za-z0-9_.-]+$" }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.:-]+$" }
    LoyaltyPointsResult:
      type: object
      required: [relationshipId, pointsBalance, applied]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        pointsBalance: { type: integer }
        statusName: { type: string }
        applied: { type: boolean, description: "False when this call replayed an earlier request with the same key." }
    ConsumeRedemptionRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "The code the customer shows, e.g. K7M2Q-9XPB4." }
        locationCode: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9_.:-]+$", description: Optional till or store id recorded with the redemption. }
    RedemptionReceipt:
      type: object
      required: [redemptionId, rewardId, rewardTitle, kind, consumerReference, redeemedAt]
      properties:
        redemptionId: { $ref: "#/components/schemas/Uuid" }
        rewardId: { $ref: "#/components/schemas/Uuid" }
        rewardTitle: { type: string }
        kind: { $ref: "#/components/schemas/RewardKind" }
        consumerReference: { $ref: "#/components/schemas/Uuid", description: "Deprecated per-business pseudonym; use subjectRef." }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        redeemedAt: { $ref: "#/components/schemas/Timestamp" }
        pointsSpent: { type: integer }
        locationCode: { type: string }

    Capability:
      type: string
      description: Stable capability ID. Unknown future IDs must be treated as not granted.
      enum: [message.send, contact.reachable, consent.request, auth.challenge, transaction.approve, age.minimum, identity.name, identity.address, identity.verified]
    BusinessRiskTier:
      type: string
      description: "M messaging, A approvals, V verified attributes, E enterprise. Holding a tier grants no capability by itself."
      enum: [M, A, V, E]
    BusinessCapabilitiesResponse:
      type: object
      required: [businessId, environment, tiers, entitlements, keyScopes, effective, catalog]
      properties:
        businessId: { $ref: "#/components/schemas/Uuid" }
        environment: { type: string, enum: [live, test] }
        tiers: { type: array, items: { $ref: "#/components/schemas/BusinessRiskTier" } }
        entitlements: { type: array, description: What Viadere granted the business (the ceiling)., items: { $ref: "#/components/schemas/Capability" } }
        keyScopes: { type: array, description: What this key carries., items: { $ref: "#/components/schemas/Capability" } }
        effective: { type: array, description: Key scopes intersected with entitlements, minus anything switched off., items: { $ref: "#/components/schemas/Capability" } }
        catalog: { type: array, items: { $ref: "#/components/schemas/CapabilityDefinition" } }
    CapabilityDefinition:
      type: object
      required: [capability, title, summary, parameters, requiresPurpose, requiredEvidence, sensitivity, minimumTier, consent, customerUX, output, maxResultRetentionSeconds, auditFields, revocation, auditsAllowedDecisions]
      properties:
        capability: { $ref: "#/components/schemas/Capability" }
        title: { type: string }
        summary: { type: string }
        parameters:
          type: array
          description: Typed inputs; unknown parameters are rejected.
          items:
            type: object
            required: [name, type, required, summary]
            properties:
              name: { type: string }
              type: { type: string, enum: [string, integer, boolean, timestamp, object] }
              required: { type: boolean }
              allowedIntegers: { type: array, items: { type: integer } }
              allowedStrings: { type: array, items: { type: string } }
              maxLength: { type: integer }
              minimum: { type: integer }
              maximum: { type: integer }
              summary: { type: string }
        requiresPurpose: { type: boolean }
        requiredEvidence: { type: string, enum: [none, registeredAuthenticator, verifiedAgeThreshold, verifiedIdentity] }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        minimumTier: { $ref: "#/components/schemas/BusinessRiskTier" }
        consent:
          type: object
          required: [mode, purpose]
          properties:
            mode: { type: string, enum: [none, activeRelationship, relationshipPurpose, perRequestReceipt] }
            purpose: { type: string }
        customerUX: { type: string, enum: [none, notification, secureSheet, verificationFlow] }
        output:
          type: object
          required: [fields]
          description: The explicit list of fields a result may carry. `age.minimum` lists only meets_threshold, assurance, issued_at, expires_at and audience.
          properties:
            fields:
              type: array
              items:
                type: object
                required: [name, type, class, summary]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [string, integer, boolean, timestamp, object] }
                  class: { type: string, enum: [assertion, assurance, metadata, personal_data] }
                  summary: { type: string }
        maxResultRetentionSeconds: { type: integer }
        auditFields: { type: array, items: { type: string } }
        revocation: { type: string, enum: [stops_future_use, cancels_pending, expires_assertion] }
        auditsAllowedDecisions: { type: boolean }

    WebhookEventType:
      type: string
      description: Open set; ignore (and acknowledge) types you do not recognize.
      examples: [interaction.decided]
      enum: [interaction.decided, interaction.expired, interaction.cancelled, message.received, relationship.connected, relationship.disconnected, consent.updated, reward.redeemed]
    WebhookSubscription:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        url: { type: string, format: uri, pattern: "^https://" }
        events: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        active: { type: boolean }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, pattern: "^https://" }
        events: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/WebhookEventType" } }
    WebhookSecretResponse:
      type: object
      required: [subscription, secret]
      properties:
        subscription: { $ref: "#/components/schemas/WebhookSubscription" }
        secret: { type: string, pattern: "^whsec_[A-Za-z0-9_-]{43}$", description: Shown once. HMAC key is the UTF-8 bytes of the whole string, prefix included. }

    WebhookEventEnvelope:
      type: object
      required: [id, type, createdAt, businessId, apiVersion, data]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        type: { $ref: "#/components/schemas/WebhookEventType" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        businessId: { $ref: "#/components/schemas/Uuid" }
        apiVersion: { type: string, examples: ["2026-10-27"] }
        data: { description: Event-specific payload. }
    MessageReceivedData:
      type: object
      required: [sessionId, relationshipId, messageId, text, channel, receivedAt]
      properties:
        sessionId: { $ref: "#/components/schemas/Uuid" }
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        messageId: { $ref: "#/components/schemas/Uuid" }
        text: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
    RelationshipEventData:
      type: object
      required: [relationshipId, occurredAt]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        source: { type: string, enum: [handle, code, qr, button, link, search, sms, appClip] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
    ConsentUpdatedData:
      type: object
      required: [relationshipId, purpose, granted, occurredAt]
      properties:
        relationshipId: { $ref: "#/components/schemas/Uuid" }
        subjectRef: { $ref: "#/components/schemas/SubjectRef" }
        purpose: { $ref: "#/components/schemas/InteractionPurpose" }
        granted: { type: boolean }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
