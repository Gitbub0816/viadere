# Run one reviewed authority admin command (ADR-0019 section 5, ADR-0028 section 6.5): `ViadereAuthority admin <command> --change-file <path>
# --commit <sha>` in job-viadere-authority-admin. The change file is a commit on protected main (CODEOWNERS). The environment
# authority-admin-staging has required reviewers and "Prevent self-review".
#
# Key inventory (ADR-0024 section 7.3, ledger S6-06): NO log is read. The admin job has no Key Vault role, so it cannot read public keys. The
# inventory is a reviewed change file (public JWKs read by the crypto-officer group through PIM, or a seal key's public half); `key-inventory-record`
# stores it, the SERVING authority verifies every entry against Key Vault at exactly name/version (or its unwrapped seal key), and this workflow
# waits for `key-inventory-check`, whose job execution succeeds only when every entry is verified. Only then is the inventory built from the same
# change file, its RFC 7638 thumbprints re-derived, and attested (GitHub artifact attestation); authority-publish.yml admits a JWK only if it
# matches that attested inventory. The workflow identity holds only the job-starter role (policy rule AUTH-INVENTORY-CHANNEL).
name: Authority admin

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Admin command (client-register, link-client-register, keylog-import, key-version-pin, key-inventory-record, seal-key-create, seal-key-exposed)"
        type: string
        required: true
      change_file:
        description: "Path of the reviewed change file on main (e.g. Infra/azure-authority/changes/0001.json)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: authority-admin
  cancel-in-progress: false

env:
  AZ_MIN_VERSION: 2.91.0

jobs:
  admin:
    name: Run the admin job (and attest a verified key inventory)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: authority-admin-staging
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      COMMAND: ${{ inputs.command }}
      CHANGE_FILE: ${{ inputs.change_file }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_AUTH_RESOURCE_GROUP: ${{ vars.AZURE_AUTH_RESOURCE_GROUP }}
      JOB: job-viadere-authority-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs (main only; change file inside the repository, no traversal; check is not a command of its own)
        run: |
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "admin commands run from main only" >&2; exit 1; }
          [[ "${COMMAND}" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "invalid command" >&2; exit 1; }
          [ "${COMMAND}" != "key-inventory-check" ] || { echo "key-inventory-check runs only after key-inventory-record" >&2; exit 1; }
          [[ "${CHANGE_FILE}" =~ ^Infra/azure-authority/changes/[A-Za-z0-9._-]+\.json$ ]] || { echo "change file must be Infra/azure-authority/changes/<name>.json" >&2; exit 1; }
          [ -f "${CHANGE_FILE}" ] || { echo "change file not found on main" >&2; exit 1; }
          if [ "${COMMAND}" = "key-inventory-record" ]; then
            # Refuse a malformed or private-member inventory before anything runs in Azure.
            python3 -I .github/scripts/key_inventory.py --change-file "${CHANGE_FILE}" "$RUNNER_TEMP/precheck.json"
          fi
          {
            echo "### Authority admin run"
            echo "Command: \`${COMMAND}\` — change file: \`${CHANGE_FILE}\` at \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Azure CLI login (workload identity federation, no secret)
        run: |
          az config set extension.use_dynamic_install=no core.only_show_errors=true > /dev/null
          python3 -I - "$(az version --query '"azure-cli"' -o tsv)" "${AZ_MIN_VERSION}" <<'PY'
          import sys
          have, need = (tuple(int(p) for p in v.split(".")[:3]) for v in sys.argv[1:3])
          sys.exit(0 if have >= need else f"Azure CLI {sys.argv[1]} is older than {sys.argv[2]}")
          PY
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::${token}"
          az login --service-principal --username "${AZURE_CLIENT_ID}" --tenant "${AZURE_TENANT_ID}" --federated-token "${token}" --output none
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"
      - name: Start the job with this command and wait for its exit status
        run: |
          # The change file content is read by the job from the image of the SAME commit (baked path, not an upload). Only the execution's
          # status is read back: never its log.
          run_job() {
            local execution status
            execution="$(az containerapp job start --name "${JOB}" --resource-group "${AZURE_AUTH_RESOURCE_GROUP}" \
              --args admin "$1" --change-file "${CHANGE_FILE}" --commit "${GITHUB_SHA}" --query name -o tsv)"
            for _ in $(seq 1 60); do
              status="$(az containerapp job execution show --name "${JOB}" --resource-group "${AZURE_AUTH_RESOURCE_GROUP}" \
                --job-execution-name "${execution}" --query properties.status -o tsv)"
              case "${status}" in
                Succeeded) return 0 ;;
                Failed|Stopped|Degraded) echo "admin job $1: ${status}" >&2; return 1 ;;
              esac
              sleep 15
            done
            echo "admin job $1 did not finish in 15 minutes" >&2
            return 1
          }
          run_job "${COMMAND}"
      - name: Wait until the serving authority verified every inventory entry (key-inventory-check exit status)
        if: inputs.command == 'key-inventory-record'
        run: |
          # The serving authority checks recorded rows at start and every minute; a mismatch never turns into "verified".
          for attempt in $(seq 1 10); do
            execution="$(az containerapp job start --name "${JOB}" --resource-group "${AZURE_AUTH_RESOURCE_GROUP}" \
              --args admin key-inventory-check --change-file "${CHANGE_FILE}" --commit "${GITHUB_SHA}" --query name -o tsv)"
            status=""
            for _ in $(seq 1 40); do
              status="$(az containerapp job execution show --name "${JOB}" --resource-group "${AZURE_AUTH_RESOURCE_GROUP}" \
                --job-execution-name "${execution}" --query properties.status -o tsv)"
              case "${status}" in
                Succeeded|Failed|Stopped|Degraded) break ;;
              esac
              sleep 15
            done
            if [ "${status}" = "Succeeded" ]; then
              echo "Inventory verified by the serving authority (attempt ${attempt})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 60
          done
          echo "the serving authority did not verify every entry (mismatch, unavailable key, or the authority is not running)" >&2
          exit 1
      - name: Build the inventory from the reviewed change file (thumbprints re-derived; public members only)
        if: inputs.command == 'key-inventory-record'
        run: python3 -I .github/scripts/key_inventory.py --change-file "${CHANGE_FILE}" key-inventory.json
      - name: Attest the key inventory
        if: inputs.command == 'key-inventory-record'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: key-inventory.json
      - if: inputs.command == 'key-inventory-record'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authority-key-inventory
          path: key-inventory.json
          retention-days: 90
      - name: Log out
        if: always()
        run: az logout || true
