# Release: build the Server image and the Authority image (separate images, ADR-0019), scan them, push them to GHCR, generate and attest
# an SBOM, sign them (cosign keyless / GitHub OIDC), attach SLSA build provenance. Then:
#   * the ordinary tier is deployed by DIGEST to Azure by azure.yml (staging only; reusable workflow, GitHub environment `staging`);
#   * the authority image is NEVER deployed from here: authority-deploy.yml (separate identity, GitHub environment `authority-staging`
#     with required reviewers) is started by the owner with the digest (ADR-0028 section 6).
# Fly was retired (ADR-0029): there is no Fly deploy job, no FLY_API_TOKEN and no production deploy path until a production Azure
# environment is approved. No long-lived cloud credentials exist in this workflow: signing uses the job's OIDC token.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false # never cancel a half-finished release

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build, scan, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance (Sigstore OIDC)
      attestations: write # GitHub artifact attestations
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-tools.sh cosign syft trivy
      - name: Image name and tags
        id: meta
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/viadere-server"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build (context = repository root)
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker build -f Server/Dockerfile \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${SHA_TAG}" .
      - name: Scan before publishing (fail on fixable HIGH or CRITICAL)
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${SHA_TAG}"
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push
        id: push
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "${SHA_TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${SHA_TAG}" | cut -d@ -f2)"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "${SHA_TAG}" "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          fi
      - name: SBOM (SPDX) of the pushed image
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: syft "registry:${REF}" -o spdx-json=sbom.spdx.json
      - name: Sign the image (keyless)
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REF}"
      - name: Attach the SBOM as a signed attestation
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${REF}"
      - name: SLSA build provenance (GitHub artifact attestation, pushed to the registry)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-server-image
          path: sbom.spdx.json
          retention-days: 365

  build-authority:
    name: Build, scan, sign, attest (authority image)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign + provenance (Sigstore OIDC)
      attestations: write # GitHub artifact attestations
    outputs:
      present: ${{ steps.detect.outputs.present }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The authority executable lands with the Stage 2 server work (Server/Sources/ViadereAuthority, ADR-0019 section 2). Until its
      # Dockerfile exists this job is a no-op, so the release of the ordinary tier is unaffected.
      - name: Detect the authority Dockerfile
        id: detect
        run: |
          if [ -f Server/Dockerfile.authority ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "Server/Dockerfile.authority not present yet: skipping"; fi
      - name: Install checksum-pinned tools
        if: steps.detect.outputs.present == 'true'
        run: .github/scripts/install-tools.sh cosign syft trivy
      - name: Image name and tags
        if: steps.detect.outputs.present == 'true'
        id: meta
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}/viadere-authority"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build (context = repository root)
        if: steps.detect.outputs.present == 'true'
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker build -f Server/Dockerfile.authority \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${SHA_TAG}" .
      - name: Scan before publishing (fail on fixable HIGH or CRITICAL)
        if: steps.detect.outputs.present == 'true'
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${SHA_TAG}"
      - name: Log in to GHCR
        if: steps.detect.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
      - name: Push
        if: steps.detect.outputs.present == 'true'
        id: push
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "${SHA_TAG}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${SHA_TAG}" | cut -d@ -f2)"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "${SHA_TAG}" "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          fi
      - name: SBOM (SPDX) of the pushed image
        if: steps.detect.outputs.present == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: syft "registry:${REF}" -o spdx-json=sbom-authority.spdx.json
      - name: Sign the image (keyless)
        if: steps.detect.outputs.present == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REF}"
      - name: Attach the SBOM as a signed attestation
        if: steps.detect.outputs.present == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom-authority.spdx.json "${REF}"
      - name: SLSA build provenance (GitHub artifact attestation, pushed to the registry)
        if: steps.detect.outputs.present == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary (the digest the owner passes to authority-deploy.yml)
        if: steps.detect.outputs.present == 'true'
        env:
          REF: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          echo "### Authority image" >> "$GITHUB_STEP_SUMMARY"
          echo "${REF} (commit ${GITHUB_SHA}). Deploy with authority-deploy.yml; it is not deployed automatically." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.detect.outputs.present == 'true'
        with:
          name: sbom-authority-image
          path: sbom-authority.spdx.json
          retention-days: 365

  # Ordinary tier only. A pre-release tag (v1.2.3-anything) builds, signs and publishes the images without deploying (e.g. the first Azure
  # apply needs a signed digest). The workflow verifies the signature and the workflow identity before it touches Azure.
  deploy-staging:
    name: Deploy to Azure staging
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/azure.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}
